<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e2534" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión | Mbapo</title>
    <style>
      :root {
        color: #17333f;
        background: #fbfcfa;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        max-width: 34rem;
        padding: 2rem;
        text-align: center;
      }

      img {
        width: 4.5rem;
        height: 4.5rem;
      }

      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: clamp(1.65rem, 5vw, 2.25rem);
      }

      p {
        line-height: 1.6;
      }

      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 0.7rem;
        padding: 0.8rem 1.1rem;
        color: #fff;
        background: #0e6251;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #f2b84b;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <img src="/icon.svg" alt="Mbapo" width="72" height="72" />
      <h1 id="offline-title">Estás sin conexión</h1>
      <p>
        No pudimos cargar esta pantalla. Cuando recuperes Internet, podés
        intentarlo de nuevo sin perder esta navegación.
      </p>
      <button type="button" onclick="window.location.reload()">
        Reintentar
      </button>
    </main>
    <script>
      window.addEventListener("online", () => window.location.reload());
    </script>
  </body>
</html>
