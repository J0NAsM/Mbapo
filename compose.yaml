services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mbapo}
      POSTGRES_USER: ${POSTGRES_USER:-mbapo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mbapo_local_only}
    ports:
      - "5432:5432"
    volumes:
      - mbapo_postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  mbapo_postgres:
