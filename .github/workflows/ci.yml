name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mbapo_test
          POSTGRES_USER: mbapo
          POSTGRES_PASSWORD: mbapo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mbapo -d mbapo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --audit-level=high
      - run: npm test
        env:
          MBAPO_TEST_DATABASE_URL: postgresql://mbapo:mbapo_test_password@127.0.0.1:5432/mbapo_test
      - run: npm run build
      - run: docker build --tag mbapo:ci .
